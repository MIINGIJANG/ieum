# main 에 푸시하면 Hugging Face Space(MIINGI/ieum)에 자동으로 올림 → Space 가 다시 빌드(5~10분)
# 필요: GitHub 저장소 Settings → Secrets → Actions 에 HF_TOKEN (Hugging Face Write 토큰)
# 번역 모델(best.pt)·검색 인덱스는 GitHub 에 없으므로 Space 에 이미 올린 것을 그대로 씀
name: Hugging Face Space 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # 올리기 전에 확인: 테스트 + 환각 방지 평가(기준 점수 data/eval/baseline.json). 하나라도 실패하면 올리지 않음
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: grep -v '^torch' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt pytest httpx
      - run: python -m pytest -q tests
      - name: 환각 방지 평가 (결과 표는 Actions 실행 화면의 Summary)
        run: python scripts/eval/ci_eval.py
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -U huggingface_hub
      - run: python scripts/deploy/make_space.py --no-ckpt
      - name: Space 에 기록 보관용 토큰 넣기 (수어 없는 단어 기록을 HF 데이터셋 MIINGI/ieum-logs 에 보관, ksl/logsync.py)
        continue-on-error: true          # 실패해도 배포는 진행 (기록만 서버가 다시 켜지면 처음부터)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).add_space_secret(
              "MIINGI/ieum", "KSL_HF_TOKEN", os.environ["HF_TOKEN"],
              description="수어 없는 단어 기록을 데이터셋 MIINGI/ieum-logs 에 보관 (ksl/logsync.py)")
          print("Space 비밀값 KSL_HF_TOKEN 설정")
          PY
      - name: Space 에 올리기
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN 이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 이름 HF_TOKEN 으로 넣으세요."; exit 1
          fi
          if ! hf auth whoami > who.txt 2>&1; then
            echo "::error::HF_TOKEN 이 올바르지 않습니다(만료·오타). Hugging Face 에서 Write 토큰을 새로 만들어 다시 넣으세요. $(tail -1 who.txt)"; exit 1
          fi
          echo "Hugging Face 계정: $(head -1 who.txt)"
          # 코드·데이터 폴더는 Space 에서 지운 뒤 새로 올림 (폴더 구조를 바꿔도 예전 파일이 남지 않게, 번역 모델 checkpoints/ 는 유지)
          if ! hf upload MIINGI/ieum dist/space . --repo-type space \
               --delete "data/*" --delete "ksl/*" --delete "web/*" --delete "scripts/*" \
               --commit-message "GitHub ${GITHUB_SHA::7} $(git log -1 --format=%s | head -c 80)" > up.txt 2>&1; then
            cat up.txt
            echo "::error::업로드 실패 (토큰이 Read 권한이거나 MIINGI/ieum 쓰기 권한이 없음): $(grep -m1 -iE 'error|denied|forbidden|401|403' up.txt | head -c 300)"; exit 1
          fi
          cat up.txt
      - name: 멈춰 있으면 다시 켜기 (일시정지·잠자기 상태면 올려도 사이트가 안 열림)
        continue-on-error: true          # 다시 켜지 못해도 올리기는 성공한 것
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy/ensure_running.py MIINGI/ieum
