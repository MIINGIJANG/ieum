<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>이음 · 수어 인식 평가</title>
<style>
  :root { --bg: #ffffff; --box: #e8e8e8; --ink: #000000; }
  @media (prefers-color-scheme: dark) { :root { --bg: #242526; --box: #3e3f40; --ink: #ffffff; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 22px; }
  .box { background: var(--box); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; overflow-x: auto; }
  button { font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: 4px 6px; border-top: 1px solid var(--ink); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>수어 인식 평가</h1>
  <p><a href="./">수어로 묻기</a>의 '정확도 평가용 녹화'로 저장한 파일을 넣으면, 같은 녹화를 설정별로 다시 돌려 비교합니다 (질문·낱말을 적고 녹화한 파일만 점수가 나옵니다).</p>
  <div class="box">
    <input type="file" id="files" accept=".json" multiple>
    <div><button id="run" disabled>평가하기</button> <span id="msg"></span></div>
  </div>
  <div class="box" id="result"></div>
  <div class="box" id="detail"></div>
</main>
<script type="module" src="./eval.js"></script>
</body>
</html>
