<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>이음 · 수어로 묻기 (시험판)</title>
<style>
  /* 본 화면(web/index.html)과 같은 색 */
  :root { --bg: #ffffff; --box: #e8e8e8; --hover: #dcdcdc; --strong: #5f5f5f; --ink: #000000; --on: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #242526; --box: #3e3f40; --hover: #48494a; --strong: #0d0d0e; --ink: #ffffff; --on: #ffffff; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  h2 { margin: 0; font-size: 1rem; }
  p { margin: 0; }
  small { opacity: .7; }
  a { color: inherit; }
  .box { background: var(--box); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
  /* 본 화면에서 카메라 버튼을 누르면 뜰 큰 박스 (기존 박스 색), 안쪽 박스는 마우스 올림 색 */
  .panel { background: var(--box); border-radius: 14px; padding: 16px; display: grid; gap: 16px; }
  .panel .box { background: var(--hover); }
  button { font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 8px; padding: 6px 12px; }
  button { cursor: pointer; }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .cam { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; background: #000; }   /* 정사각형, 꺼져도 크기 그대로 */
  .cam .off { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; color: #fff; }
  .cam .off .bar { width: min(320px, 70vw); background: rgba(255, 255, 255, .25); }
  .cam .off .bar i { background: #fff; }
  #stop { position: absolute; right: 12px; bottom: 12px; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }   /* 거울처럼 보이게 */
  .hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff; text-shadow: 0 1px 3px #000; }
  #live { font-size: 1.2rem; min-height: 1.6em; }
  .chip { display: inline-flex; background: var(--bg); border-radius: 8px; overflow: hidden; }
  .chip .w { border-radius: 0; font-weight: 500; padding: 6px 12px; }
  .chip .x { border-radius: 0; opacity: .6; padding: 6px 8px; }
  .chip.unsure .w { opacity: .7; }
  #words { display: flex; flex-wrap: wrap; gap: 6px; min-height: 2.2em; align-items: center; }
  .empty { opacity: .6; }
  #alts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #suggest { display: grid; gap: 6px; }
  #suggest .q { text-align: left; }
  #suggest .direct { opacity: .8; }
  #answer .q { font-weight: 500; }
  #answer .blocks { opacity: .8; font-size: .95rem; }
</style>
</head>
<body>
<main>
<div class="panel">
  <section class="cam">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <p class="hint" id="handHint" hidden>손이 보이지 않아요</p>
    <div class="off" id="loadBox">
      <p id="loadMsg">처음 한 번 인식 모델(약 60MB)을 받습니다.</p>
      <div class="bar"><i id="loadBar"></i></div>
      <button id="start">카메라 켜기</button>
    </div>
    <button id="stop" hidden>카메라 끄기</button>
  </section>

  <section class="box" id="run">
    <div class="row"><span id="fps">카메라 꺼짐</span></div>
    <div><b id="segState">손을 올려 시작</b></div>
    <div>지금 보이는 수어: <span id="live">—</span></div>
  </section>

  <section class="box">
    <div class="row"><h2>알아들은 낱말</h2> <small>낱말을 누르면 다른 후보로 바꿀 수 있어요 (? 는 확실하지 않은 낱말)</small> <button id="clear">모두 지우기</button></div>
    <div id="words"></div>
    <div id="alts" hidden></div>
    <div id="suggest"></div>
  </section>

  <section class="box" id="answer" hidden></section>
</div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
