<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>이음 · 수어로 묻기 (시험판)</title>
<link rel="stylesheet" href="./popup.css">
<style>
  /* 시험 페이지: 본 화면처럼 입력창 하나와 카메라 버튼만 (팝업 모양·동작은 popup.css·app.js, 본 화면과 같음) */
  :root { --bg: #ffffff; --box: #e8e8e8; --ink: #000000; }
  @media (prefers-color-scheme: dark) { :root { --bg: #242526; --box: #3e3f40; --ink: #ffffff; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { position: relative; max-width: 452px; margin: 0 auto; padding: 16px 16px 32px; }
  form.query { position: relative; }
  form.query input { width: 100%; padding: 15px 56px 15px 20px; border: 0; border-radius: 999px; background: var(--box); color: var(--ink); font: inherit; font-size: 1rem; }
  form.query input::placeholder { color: var(--ink); opacity: 1; }
  form.query input:focus { outline: none; }
  form.query #camBtn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 40px; padding: 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  form.query #camBtn svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<main>
<form class="query" id="form" onsubmit="return false">
  <input id="q" autocomplete="off" placeholder="어떤 도움을 드릴까요?" aria-label="질문">
  <button id="camBtn" type="button" aria-label="카메라로 수어 입력"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5a2 2 0 0 1 2-2h2l1.5-2h6l1.5 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
</form>
<div class="panel" id="panel" hidden>
  <p class="notice">수어를 표현해 주세요.</p>
  <section class="cam">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="off" id="loadBox" hidden>
      <button id="start">카메라 켜기</button>
    </div>
  </section>

  <div id="wordsWrap" hidden>
    <p class="notice">표현하신 단어를 클릭해 주세요.</p>
    <section class="box">
      <div id="words"></div>
    </section>
  </div>
  <div id="suggest"></div>

</div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
