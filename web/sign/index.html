<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>이음 · 수어로 묻기 (시험판)</title>
<style>
  /* 본 화면(web/index.html)과 같은 색 */
  :root { --bg: #ffffff; --box: #e8e8e8; --hover: #dcdcdc; --strong: #5f5f5f; --ink: #000000; --on: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #242526; --box: #3e3f40; --hover: #48494a; --strong: #0d0d0e; --ink: #ffffff; --on: #ffffff; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; }
  small { opacity: .7; }
  .box { background: var(--box); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
  button { font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .cam { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #000; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }   /* 거울처럼 보이게 */
  .hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff; text-shadow: 0 1px 3px #000; }
  #live { font-size: 1.2rem; min-height: 1.6em; }
  .chip { display: inline-flex; background: var(--bg); border-radius: 8px; overflow: hidden; }
  .chip .w { border-radius: 0; font-weight: 500; }
  .chip .x { border-radius: 0; opacity: .6; padding: 6px 8px; }
  #words { display: flex; flex-wrap: wrap; gap: 6px; min-height: 2.2em; align-items: center; }
  .empty { opacity: .6; }
  #alts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #suggest { display: grid; gap: 6px; }
  #suggest .q { text-align: left; }
  #suggest .direct { opacity: .8; }
  #answer .q { font-weight: 500; }
  #answer .blocks { opacity: .8; font-size: .95rem; }
  label { display: flex; gap: 8px; align-items: flex-start; }
  label input { margin-top: .35em; }
  #run { display: grid; gap: 12px; }
</style>
</head>
<body>
<main>
  <h1>수어로 묻기 <small>시험판</small></h1>
  <p>카메라 앞에서 수어를 하면 낱말을 알아듣고, 비슷한 질문을 찾아 이음에 물어봅니다. 영상은 이 기기 안에서만 처리되고 밖으로 나가지 않습니다. 두 손이 보이게 카메라를 고정해 주세요.</p>

  <section class="box" id="loadBox">
    <p id="loadMsg">처음 한 번 인식 모델(약 60MB)을 받습니다.</p>
    <div class="bar"><i id="loadBar"></i></div>
    <div class="row"><button id="start">카메라 켜기</button></div>
  </section>

  <section id="run" hidden>
    <div class="cam">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <p class="hint" id="handHint" hidden>손이 보이지 않아요</p>
    </div>
    <div class="box">
      <div class="row"><span id="fps"></span><button id="stop">카메라 끄기</button></div>
      <div>지금 보이는 수어: <span id="live">—</span></div>
      <label><input type="checkbox" id="domainOnly" checked><span>산업안전 단어만<br><small id="vocabInfo"></small></span></label>
    </div>
  </section>

  <section class="box">
    <div class="row"><b>알아들은 낱말</b> <small>낱말을 누르면 다른 후보로 바꿀 수 있어요</small> <button id="clear">모두 지우기</button></div>
    <div id="words"></div>
    <div id="alts" hidden></div>
    <div id="suggest"></div>
  </section>

  <section class="box" id="answer" hidden></section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
