<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이음</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👷</text></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">  <!-- 글꼴을 기다리지 않고 화면부터 표시 -->
<script>
  // 새로고침할 때 브라우저(특히 Safari)가 이전 결과 화면의 스크롤 위치를 되살리면,
  // 첫 화면은 스크롤이 잠겨 있어 입력창이 화면 위로 밀린 채 멈춤 → 항상 맨 위에서 시작
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  const toTop = () => { if (document.body?.classList.contains("landing")) window.scrollTo(0, 0); };
  addEventListener("pageshow", toTop); addEventListener("load", toTop); addEventListener("resize", toTop);
</script>
<style>
  :root {
    --sign-blue: #134e9a;      /* 착용 의무 표지판 파랑 */
    --sign-blue-deep: #0d3a75;
    --concrete: #eceee9;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6874;
    --line: #d5d9d2;
    --caution: #f2b705;        /* 경고 표지 노랑 */
    --caution-ink: #3d2e00;
    --block-gap: 20px;         /* 화면의 모든 박스·요소 사이 세로 간격 (하나로 통일) */
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--concrete);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    gap: var(--block-gap);
  }
  .app { grid-template-columns: minmax(0, 1fr); position: relative; }
  .app > * { min-width: 0; }

  /* ---------- 첫 화면: 가운데 입력창 → 결과 화면: 위로 ---------- */
  body.landing { overflow: hidden; }
  .hero { display: grid; gap: var(--block-gap); align-content: center; justify-items: center; }
  body.landing .hero { min-height: calc(100svh - 68px); }
  .hero h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  body.result .hero h1 { display: none; }
  .notice { display: none; margin: 0; font-size: .88rem; line-height: 1; color: var(--muted); }
  body.result .notice { display: block; }
  form.query { position: relative; width: min(100%, 640px); }
  form.query input {
    width: 100%;
    padding: 15px 64px 15px 20px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--surface);
    font-size: 1rem;
  }
  form.query input:focus, form.query input:focus-visible { outline: none; }
  form.query button {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border: 0; border-radius: 50%;
    background: var(--ink); color: #fff; cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  form.query button svg { width: 22px; height: 22px; }
  form.query button:disabled { opacity: .5; cursor: wait; }
  /* 입력창이 비어 있으면 마이크(음성 입력), 글자가 있으면 화살표(보내기) */
  form.query .i-mic { display: none; }
  form.query.mic .i-mic { display: block; }
  form.query.mic .i-send { display: none; }
  form.query.listening button { background: #d64545; animation: mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(214, 69, 69, .45); } 50% { box-shadow: 0 0 0 9px rgba(214, 69, 69, 0); } }
  @media (prefers-reduced-motion: reduce) { form.query.listening button { animation: none; } }
  /* 예시 질문 2개: 휴대폰은 한 줄에 1개씩 2줄, PC 는 한 줄에 2개. 버튼 폭은 질문 길이에 맞춤 */
  .examples { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
  @media (min-width: 761px) { .examples { flex-direction: row; flex-wrap: wrap; justify-content: center; } }   /* PC: 한 줄에 2개 */
  .examples button {
    max-width: 100%; text-align: center;
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 4px 12px; font-size: 1rem; cursor: pointer; color: var(--ink); margin: 0;
  }
  .examples button:hover { border-color: var(--sign-blue); }

  /* 결과: 아래에서 올라옴 (그 사이 아바타는 미리 불러와 둠) */
  .results { display: grid; gap: var(--block-gap); grid-template-columns: minmax(0, 1fr); }
  .results > * { min-width: 0; }
  body.landing .results { visibility: hidden; opacity: 0; transform: translateY(100vh); position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
  body.result .results { animation: rise .6s cubic-bezier(.2,.8,.2,1) .12s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(60vh); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    body.result .results { animation: none; }
  }

  /* ---------- 수어 표지판 무대 ---------- */
  .stage-wrap { display: grid; justify-items: center; gap: var(--block-gap); width: 100%; }
  .stage {
    position: relative;
    width: min(100%, 460px);
    aspect-ratio: 1.45;                 /* 배 아래는 잘라서 답변이 화면 안에 들어오도록 */
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage #av { opacity: 0; transition: opacity .5s; }
  .stage.three #av { opacity: 1; }
  .stage .loading { position: absolute; inset: auto 0 45% 0; text-align: center; color: var(--muted); font-size: 1rem; display: none; }
  .stage .loading.on { display: block; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button {   /* 단어 박스와 같은 크기·글자 */
    padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    font-weight: 500; line-height: inherit; cursor: pointer;
  }
  .controls button:hover { border-color: var(--ink); }
  .controls label { font-size: 1rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  /* 글로스 순서 */
  ol.glosses {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  ol.glosses li {
    padding: .25em .62em; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    font-weight: 500; transition: background .15s, color .15s;
  }
  ol.glosses li.nomo { background: #d9dcd6; border-color: #d9dcd6; color: var(--ink); }   /* 동작 없는 단어: 재생 안 함 */
  ol.glosses li.play { cursor: pointer; }   /* 동작 있는 단어: 누르면 그 단어만 다시 보기 */
  ol.glosses li.fs { border-style: dashed; }   /* 지문자로 표현한 단어 */
  ol.glosses li.sub { border-style: dashed; }  /* 대체 표현 (비슷한 뜻의 다른 수어) */
  ol.glosses li.fs::after { content: "지문자"; margin-left: 4px; font-size: 0.7em; opacity: 0.65; vertical-align: 0.15em; }
  ol.glosses li.play:hover { border-color: var(--ink); }
  ol.glosses li.active { background: var(--ink); color: #fff; border-color: var(--ink); }   /* 지금 표현 중 */

  /* ---------- 답변 · 출처 ---------- */
  .answer { background: var(--surface); border-radius: 14px; padding: 18px; border: 1px solid var(--line); }
  .answer h2 { font-size: 1rem; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .answer .text { font-size: 1rem; margin: 0 0 12px; }
  .answer .hint { color: var(--muted); font-size: 1rem; margin: -4px 0 0; }
  .answer > :last-child { margin-bottom: 0; }
  .warn {
    border-left: 4px solid var(--caution); background: #fffaea; padding: 8px 12px; border-radius: 0 8px 8px 0;
    font-size: 1rem; margin: 0 0 12px;
  }
  .info { display: grid; gap: var(--block-gap); }
  .info > * { min-width: 0; }
  .src ul { list-style: none; margin: 0; padding: 0; font-size: 1rem; color: var(--muted); }
  .src li { margin-bottom: 12px; }
  .src li:last-child { margin-bottom: 0; }   /* 박스 아래 여백 = 좌우 여백 */
  .src li p { margin: 2px 0 0; }
  .src b { color: var(--ink); font-weight: 500; }
  .src b .t2 { white-space: nowrap; }
  @media (max-width: 760px) { .src b .t1 { display: block; } }   /* 휴대폰: 제목 앞부분 / 마지막 단어 + 페이지 두 줄 */
  .src .tbl { overflow-x: auto; margin: 6px 0 8px; }
  .src .pdf { overflow: hidden; margin: 8px 0 0; border: 1px solid var(--line); border-radius: 6px; background: #f2f2f2; }   /* 쪽 이미지 바탕과 같은 회색 */
  .src .pdf img { display: block; max-width: none; height: auto; }
  .src table { border-collapse: collapse; width: 100%; font-size: 1rem; color: var(--ink); background: var(--surface); }
  .src th, .src td { border: 1px solid #9aa1a8; padding: 5px 8px; vertical-align: middle; line-height: 1.45; }
  .src th { background: #f1f2ef; font-weight: 500; text-align: center; }
  .src td:first-child { text-align: center; }
  .empty { color: var(--muted); }
  .error { color: #9b1c1c; }

  /* 첫 로딩 화면: 아바타·출처 이미지·번역 모델을 모두 준비한 뒤 사라짐 (사용 중에는 기다림 없음) */
  .boot { position: fixed; inset: 0; z-index: 1000; background: var(--concrete); }
  /* 제목 '이음'은 첫 화면 제목과 같은 글꼴·크기·위치 (위치는 JS 가 첫 화면 제목에 맞춤) → 로딩이 끝나도 제목이 안 움직임 */
  .boot .in { visibility: hidden; position: absolute; left: 0; right: 0; top: 40%; display: flex; flex-direction: column; align-items: center; gap: var(--block-gap); }
  .boot .in.placed { visibility: visible; }   /* 첫 화면 제목 위치를 잰 뒤에만 보임 (가운데에 떴다가 튀어오르지 않게) */
  .boot h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .boot .bar { width: min(240px, 60vw); height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .boot .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 3px; transition: width .3s ease; }
  .boot p { margin: 0; color: var(--muted); font-size: 1rem; min-height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { .boot .bar i { transition: none; } }

  /* 화면이 넓어도 위아래 배치 (입력창 폭에 맞춤) */
  .results { width: min(100%, 640px); margin: 0 auto; }
</style>
</head>
<body class="landing">
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="in" id="bootIn">
    <h1>이음</h1>
    <div class="bar" aria-hidden="true"><i id="bootBar"></i></div>
    <p id="bootMsg">아바타를 준비하는 중…</p>
  </div>
</div>
<main class="app">
  <section class="hero" aria-label="검색">
    <h1>이음</h1>
    <p class="notice">일부 단어의 수어 동작만 준비되어 있습니다.</p>
    <form class="query" id="form">
      <input id="q" name="q" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="어떤 도움을 드릴까요?" aria-label="질문 또는 문장 입력">
      <button id="go" type="button" aria-label="수어로 보기">
        <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </form>
    <div class="examples" id="examples"></div>
  </section>

  <div class="results" id="results">
    <section class="stage-wrap" aria-label="수어 재생">

      <ol class="glosses" id="glosses" aria-label="수어 순서"></ol>

        <button type="button" id="replay">다시 보기</button>
      </div>
    </section>

    <div class="info">

      <section class="answer src" id="sources" aria-label="출처" hidden></section>
    </div>
  </div>
</main>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/",
  "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
} }
</script>
<script type="module">
import { SignAvatar } from "./avatar.js";
// 아바타 불러오기: 기본은 반실사 GLB (web/models/avatar.glb). 두 번 실패하면 예전 VRM 아바타로 (화면이 비지 않게)
// ?avatar=vrm 이면 VRM 만, ?avatar=이름 이면 web/models/이름.glb. 실패 이유는 콘솔과 window.avatarErrors 에 남김
const canvas = document.getElementById("av");
const pick = new URLSearchParams(location.search).get("avatar");
const order = pick === "vrm" ? ["./models/avatar.vrm"] : [pick ? `./models/${pick}.glb` : "./models/avatar.glb", "./models/avatar.vrm"];
window.avatarErrors = [];
outer: for (const url of order) {
  for (let i = 0; i < 2; i++) {
    const av = new SignAvatar(canvas);
    try {
      window.avatar = await av.load(url);
      console.info("3D 아바타:", url, (window.avatar._loadMs / 1000).toFixed(1) + "초");
      document.getElementById("stage").classList.add("three");
      window.dispatchEvent(new Event("avatar-ready"));
      break outer;
    } catch (e) {
      console.error("3D 아바타 불러오기 실패", url, i + 1, e);
      window.avatarErrors.push(url + ": " + (e && e.message || e));
      try { av.renderer.dispose(); } catch { /* 이미 정리됨 */ }
      await new Promise(r => setTimeout(r, 1500 * (i + 1)));
    }
  }
}
if (!window.avatar) window.dispatchEvent(new Event("avatar-failed"));
</script>
<script>
const API = location.protocol.startsWith("http") ? "" : "http://localhost:8000";

// ---------- 첫 로딩: 처음 쓸 때 생기는 지연을 여기서 모두 미리 처리 ----------
// 아바타(내려받기·옷 입히기), 출처 쪽 이미지, 서버(번역 모델·검색), 예시 질문, 글꼴
// 로딩 화면 제목을 첫 화면 제목과 같은 높이에
function placeBoot() {
  const inn = document.getElementById("bootIn"), h = document.querySelector(".hero h1");
  if (inn && h) { inn.style.top = `${h.getBoundingClientRect().top}px`; inn.classList.add("placed"); }
}
addEventListener("resize", placeBoot);
if (document.fonts) document.fonts.ready.then(placeBoot);
const boot = (() => {
  const steps = [];
  let done = 0;
  const bar = document.getElementById("bootBar"), msg = document.getElementById("bootMsg");
  const add = (label, p) => {
    steps.push(label);
    const t0 = performance.now();
    return Promise.resolve(p).catch(() => {}).finally(() => {
      (window.bootTimes ||= {})[label] = Math.round(performance.now() - t0);
      done++;
      bar.style.width = `${Math.round(done / steps.length * 100)}%`;
    });
  };
  const show = (t) => { msg.textContent = t; };
  return { add, show };
})();
const avatarReady = new Promise((res) => {
  if (window.avatar) return res();
  addEventListener("avatar-ready", res, { once: true });
  addEventListener("avatar-failed", res, { once: true });
});
const preloadPages = fetch(`${API}/pages`).then(r => r.ok ? r.json() : []).then(list =>
  Promise.all(list.map(u => new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = u; }))));
const warmServer = fetch(`${API}/warmup`, { method: "POST" });
const examplesReady = fetch(`${API}/examples`).then(r => r.ok ? r.json() : []);
const bootAll = Promise.all([
  boot.add("avatar", avatarReady),
  boot.add("server", Promise.race([warmServer, new Promise(r => setTimeout(r, 15000))])),   // 서버 준비는 15초까지만 기다림
  boot.add("examples", examplesReady),
  boot.add("fonts", Promise.race([document.fonts ? document.fonts.ready : null, new Promise(r => setTimeout(r, 3000))])),  // 글꼴은 3초까지만 기다림
]);
// 너무 오래 걸리면(느린 망) 60초 뒤에는 그냥 시작 (남은 준비는 뒤에서 계속)
Promise.race([bootAll, new Promise(r => setTimeout(r, 60000))]).then(() => {
  const el = document.getElementById("boot");
  el.remove();                                 // 바로 사라짐 (페이드 없음)
  toTop();
  // 로딩 화면이 사라지면 입력창(과 예시 질문)이 아래에서 올라옴. 제목 '이음'은 제자리
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches)
    [document.getElementById("form"), document.getElementById("examples")].forEach((x, i) =>
      x.animate([{ transform: "translateY(40px)", opacity: 0 }, { transform: "none", opacity: 1 }],
                { duration: 550, delay: i * 80, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }));
});
// 예시 질문: 서버(/examples)의 목록에서 무작위로 5개. 이번 접속에서 이미 한 질문과
// 주제가 같거나(같은 안내 문장·같은 문서 문단으로 답이 감) 글자가 비슷하면 숨김. 새로고침하면 다시 무작위.
let POOL = [
  "위험한 곳에서는 어떻게 해요?",
  "낙하물은 어떻게 조심해요?",
  "감전 위험이 있으면 뭘 착용해야 해요?",
  "보호구에 이상이 있는지 어떻게 확인해요?",
  "정화통은 언제 교체해요?",
].map(q => ({ question: q, topic: null }));
const SHOW = 2;   // 한 줄에 1개씩 2줄
const asked = { texts: [], topics: new Set() };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bigrams = (t) => { const s = t.replace(/[\s?.!,~]/g, ""), g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
function similar(a, b) {                       // 글자 2개 단위 겹침 비율 (짧은 쪽 기준)
  const A = bigrams(a), B = bigrams(b); let n = 0;
  A.forEach(x => { if (B.has(x)) n++; });
  return n / Math.max(1, Math.min(A.size, B.size));
}
const usable = (e) => !(e.topic && asked.topics.has(e.topic)) && !asked.texts.some(t => similar(t, e.question) >= 0.6);
let shown = [];                                // 지금 보이는 예시 (자리 고정)
function visibleExamples() {
  // 숨겨야 할 예시만 그 자리에서 새 예시로 바꾸고, 나머지는 자리를 그대로 둠
  const fresh = POOL.filter(e => usable(e) && !shown.includes(e));
  shown = shown.map(e => usable(e) ? e : fresh.shift()).filter(Boolean);
  while (shown.length < SHOW && fresh.length) shown.push(fresh.shift());
  return shown;
}
shuffle(POOL);

const $ = (id) => document.getElementById(id);
let data = null, motion = null, items = [], frameF = 0, raf = 0, lastT = 0;

// ---------- 입력 ----------
const touch = matchMedia("(pointer: coarse)").matches;   // 휴대폰·태블릿: 입력창을 직접 누를 때만 키보드
function renderExamples() {
  $("examples").innerHTML = "";
  const list = visibleExamples();
  list.forEach(e => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = e.question;
    b.onclick = () => { $("q").value = e.question; updateGo(); if (!touch) $("q").focus(); };   // 입력창에만 넣고, 화살표를 눌러야 넘어감 (휴대폰은 키보드 안 올림)
    $("examples").append(b);
  });
  // 보여줄 예시가 모자라도(모두 물어봄) 그 자리는 그대로 비워 둠 → 아래 아바타·결과가 위로 툭 올라가지 않게
  for (let i = list.length; i < SHOW; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = "\u00a0"; b.tabIndex = -1;
    b.setAttribute("aria-hidden", "true"); b.style.visibility = "hidden";
    $("examples").append(b);
  }
}
$("form").onsubmit = (e) => { e.preventDefault(); run(); };   // 키보드 Enter: 늘 보내기

// ---------- 음성 입력 ----------
// 입력창이 비어 있으면 버튼이 마이크: 누르면 한국어로 듣고 말한 내용을 입력창에 넣음 (확인 뒤 화살표로 보냄)
// 글자를 치거나 말한 내용이 들어가면 다시 화살표. 브라우저가 음성 인식을 못 하면 늘 화살표
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const PH = $("q").placeholder;
function updateGo() {
  const mic = !!SR && (listening || !$("q").value.trim());
  $("form").classList.toggle("mic", mic);
  $("form").classList.toggle("listening", listening);
  $("go").setAttribute("aria-label", listening ? "듣기 멈추기" : mic ? "음성으로 질문하기" : "수어로 보기");
}
function listen() {
  if (listening) { rec && rec.stop(); return; }
  rec = new SR();
  rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    $("q").value = [...e.results].map((r) => r[0].transcript).join("").trim();
  };
  rec.onerror = (e) => {
    const msg = e.error === "not-allowed" || e.error === "service-not-allowed" ? "마이크 사용을 허용해 주세요"
      : e.error === "no-speech" ? "말씀이 들리지 않았어요. 다시 눌러 주세요" : "음성 인식을 하지 못했어요";
    $("q").placeholder = msg;
    setTimeout(() => { $("q").placeholder = PH; }, 3000);
  };
  rec.onend = () => { listening = false; updateGo(); };
  try { rec.start(); } catch { return; }
  listening = true;
  $("q").value = "";
  updateGo();
}
$("go").onclick = () => { if ($("form").classList.contains("mic")) listen(); else run(); };
$("q").addEventListener("input", updateGo);
updateGo();

async function run() {
  const q = $("q").value.trim();
  if (!q) { $("q").focus(); return; }
  if (touch) $("q").blur();                     // 질문을 보내면 휴대폰 키보드 내림 (결과가 가려지지 않게)
  $("go").disabled = true;
  try {
    // 서버가 질문인지(문서 검색) 문장인지(바로 번역) 판단 → data.mode
    const res = await fetch(`${API}/query`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: q}),
    });
    if (res.status === 404 || res.status === 405)
      throw new Error("서버가 예전 버전입니다. 터미널에서 Ctrl+C로 끄고 다시 실행하세요");
    if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
    data = await res.json();
    asked.texts.push(q);                       // 한 질문(과 같은 주제)은 예시에서 빼기
    if (data.topic) asked.topics.add(data.topic);
    renderExamples();
    showResults();
    render();
  } catch (err) {
    showResults();
    $("sources").hidden = true;
    $("answer").innerHTML = `<p class="error">서버에 연결하지 못했습니다. 터미널에서 api 서버가 켜져 있는지 확인하세요. (${err.message})</p>`;
  } finally {
    $("go").disabled = false;
  }
}

// 첫 화면 → 결과 화면: 입력창은 제자리에서 위로 미끄러지고(FLIP), 결과는 아래에서 올라옴
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function showResults() {
  if (document.body.classList.contains("result")) return;
  // 입력창과 예시 질문은 함께 제자리에서 위로 미끄러지고(FLIP), 입력창 위 안내는 서서히 나타남
  const moving = [$("form"), $("examples")];
  const y0 = moving.map(el => el.getBoundingClientRect().top);
  document.body.classList.replace("landing", "result");
  if (reduce) return;
  const ease = { duration: 550, easing: "cubic-bezier(.2,.8,.2,1)" };
  moving.forEach((el, i) => {
    const dy = y0[i] - el.getBoundingClientRect().top;
    el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], ease);
  });
  document.querySelector(".notice").animate([{ opacity: 0 }, { opacity: 1 }], { ...ease, delay: 250, fill: "backwards" });
}

// ---------- 결과 표시 ----------
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 'FS:' 지문자 표시, '위험1'·'낙하물0#' 같은 동형어 번호는 화면에서 숨김
const label = (g) => (g.startsWith("FS:") ? g.slice(3) : g).replace(/[_\-]?\d+#?$/, "");

// 출처 제목: 휴대폰에서는 "…관한 / 기술지원규정 23페이지" 처럼 마지막 단어부터 다음 줄로
function srcTitle(s) {
  const words = String(s.title || s.doc).split(" "), last = words.pop();
  const head = words.length ? `<span class="t1">${esc(words.join(" "))}</span> ` : "";
  return `${head}<span class="t2">${esc(last)} ${esc(s.page)}페이지</span>`;
}
// 출처: 원본 PDF의 해당 부분을 그대로 잘라 보여줌 (번호·들여쓰기·표 모양 유지). 글은 대체 텍스트로
function sourceImg(s) {
  // 미리 만든 쪽 이미지(web/pages)에서 region 부분만 보이게 자름 (서버에 PDF 라이브러리 불필요)
  // loading="lazy" 를 쓰지 않음: Safari 는 잘려서 안 보이는 위치의 이미지를 끝내 안 불러와 흰 상자가 됨
  const [x0, y0, x1, y1] = s.region, w = x1 - x0, pw = s.page_width || 595;
  const pct = (v) => (v / w * 100).toFixed(3) + "%";
  return `<div class="pdf" role="img" aria-label="${esc(s.text)}" style="aspect-ratio: ${w.toFixed(1)} / ${(y1 - y0).toFixed(1)}">
    <img src="./pages/${encodeURIComponent(s.doc)}/${s.page}.png" alt="" width="1488" height="${Math.round(1488 * (s.page_height || 841) / pw)}"
         style="width: ${pct(pw)}; height: auto; margin-left: -${pct(x0)}; margin-top: -${pct(y0)}"
         onerror="const d = this.parentNode; d.nextElementSibling.hidden = false; d.remove()"></div>`;
}

// 원문 PDF 표 → HTML 표. 병합된 칸(null)은 위 칸(rowspan) 또는 왼쪽 칸(colspan)으로 합침
function tableHTML(rows) {
  const n = Math.max(...rows.map(r => r.length));
  const own = rows.map(() => Array(n).fill(null)), cells = [];
  rows.forEach((r, i) => {
    for (let j = 0; j < n; j++) {
      const v = r[j];
      if (v !== null && v !== undefined) { const c = { v, i, j, rs: 1, cs: 1 }; cells.push(c); own[i][j] = c; continue; }
      const up = i > 0 ? own[i - 1][j] : null, left = j > 0 ? own[i][j - 1] : null;
      const o = left && left.i === i && !up ? left : (up || left);
      if (!o) continue;
      own[i][j] = o;
      if (o === up) o.rs = Math.max(o.rs, i - o.i + 1); else o.cs = Math.max(o.cs, j - o.j + 1);
    }
  });
  const body = rows.map((r, i) => "<tr>" + cells.filter(c => c.i === i).map(c => {
    const tag = i === 0 ? "th" : "td";
    return `<${tag}${c.rs > 1 ? ` rowspan="${c.rs}"` : ""}${c.cs > 1 ? ` colspan="${c.cs}"` : ""}>${esc(c.v)}</${tag}>`;
  }).join("") + "</tr>").join("");
  return `<div class="tbl"><table>${body}</table></div>`;
}

// 문서에 근거가 없으면 답하지 않음 (엉뚱한 답·수어 대신 안내만)
function renderNone() {
  motion = null; items = [];
  $("glosses").innerHTML = ""; 
  $("controls").hidden = true; $("sources").hidden = true;
  $("answer").innerHTML = `<h2>답변</h2>
    <p class="text">개인보호구의 사용 및 관리에 관한 기술지원규정에서 관련 내용을 찾지 못했습니다.</p>`;
  cancelAnimationFrame(raf);
  if (window.avatar) window.avatar.setFrame(null);
}

// 단어 박스가 두 줄 이상이면 줄마다 개수가 비슷하도록: 줄 수가 늘지 않는 가장 좁은 폭을 찾아 그 폭으로 맞춤
function balanceRows(box) {
  // 1) 글자 크기는 항상 그대로 (PC·휴대폰 모두). 단어가 많으면 줄이 늘어남
  box.style.maxWidth = ""; box.style.fontSize = "";
  const lines = () => new Set([...box.children].map(c => c.offsetTop)).size;
  // 2) 여러 줄이면 줄마다 개수가 비슷하도록: 줄 수가 늘지 않는 가장 좁은 폭 + 여유
  const n = lines();
  if (n <= 1) return;
  let lo = 0, hi = box.getBoundingClientRect().width;
  while (hi - lo > 2) {
    const mid = (lo + hi) / 2;
    box.style.maxWidth = mid + "px";
    if (lines() > n) lo = mid; else hi = mid;
  }
  box.style.maxWidth = Math.ceil(hi) + 6 + "px";
}
addEventListener("resize", () => balanceRows($("glosses")));
if (document.fonts) document.fonts.ready.then(() => balanceRows($("glosses")));   // 글꼴이 늦게 로드되면 폭이 바뀌므로 다시 맞춤

function render() {
  if (data.mode === "none") return renderNone();
  $("controls").hidden = false;
  motion = data.motion;
  const sents = data.sentences || [];

  // 글로스 순서 (문장 사이 구분)
  items = [];
  const ol = $("glosses"); ol.innerHTML = "";
  let k = 0;
  sents.forEach((s) => {
    s.gloss.forEach((g, i) => {
      const li = document.createElement("li");
      li.textContent = (s.words && s.words[i]) || label(g);   // 답변에 쓰인 모양 그대로 (예: '이상이', '깨끗하게')
      const seg = motion ? motion.segments[k] : null;
      const it = { gloss: g, li, seg, nms: (s.nms && s.nms[i]) || null };   // 문법 표정·고개 (부정·조건·필요 등)
      if (!(seg && seg.has_motion)) li.className = "nomo";
      else {
        li.className = seg.fingerspell ? "play fs" : "play";
        const subOf = s.sub_of && s.sub_of[i];
        if (subOf) { li.classList.add("sub"); li.title = `'${subOf}' 수어가 없어 비슷한 뜻의 수어로 보여줌 (검수 전)`; }
        if (seg.fingerspell) li.title = `수어 동작이 없어 지문자로 표현: ${seg.fs_text}` + (seg.fs_verified ? "" : " (손 모양 검수 전)");
        li.tabIndex = 0; li.setAttribute("role", "button");
        li.onclick = () => playWord(it);
        li.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playWord(it); } };
      }
      ol.append(li);
      items.push(it);
      k++;
    });
  });

  balanceRows(ol); setTimeout(() => balanceRows(ol), 400);   // 결과가 다 그려진 뒤 한 번 더

  // 답변
  const a = $("answer");
  if (data.mode === "ask") {
    // 출처: 쪽 번호 순
    const src = [...(data.sources || [])].sort((x, y) => x.page - y.page).map(s =>
      `<li><b>${srcTitle(s)}</b>${s.region ? sourceImg(s) : ""}
        <div class="srctext"${s.region ? " hidden" : ""}>${(s.blocks || s.text.split("\n").map(t => ({type: "text", text: t})))
        .map(b => b.type === "table" ? tableHTML(b.rows) : `<p>${esc(b.text)}</p>`).join("")}</div></li>`).join("");
    a.innerHTML = `
      <h2>답변</h2>
      <p class="text">${esc(data.answer_text || "개인보호구의 사용 및 관리에 관한 기술지원규정에서 관련 내용을 찾지 못했습니다.")}</p>
`;
    $("sources").innerHTML = src ? `<h2>출처</h2><ul>${src}</ul>` : "";
    $("sources").hidden = !src;
  } else {
    $("sources").hidden = true;
    a.innerHTML = `<h2>번역한 문장</h2><p class="text">${sents.map(s => esc(s.korean)).join(" ")}</p>`;
  }
  // 결과가 다 올라온 뒤 재생 (아바타가 아직이면 준비되는 대로)
  const start = () => setTimeout(play, reduce ? 0 : 650);
  if (window.avatar) start(); else addEventListener("avatar-ready", start, { once: true });
}

// ---------- 재생 ----------
function totalFrames(m) {
  if (m) return m.frames.length;               // 동작 없는 단어는 프레임이 없어서 자동으로 건너뜀
  // 동작 데이터가 없으면 timeline(예상 시간)으로 글로스만 순서대로 강조
  return Math.round((data?.sentences || []).flatMap(s => s.timeline).reduce((t, x) => t + x.duration, 0) * 30);
}
// 지금 강조할 단어와 그 단어의 구간(segment)
function currentItem(f, m, only) {
  if (only) return { it: only, seg: m.segments[0] };
  if (m && m.segments.length) {
    let cur = null;
    for (const it of items) if (it.seg && it.seg.has_motion && f >= it.seg.start) cur = it;
    return cur && { it: cur, seg: cur.seg };
  }
  let t = f / 30, acc = 0;
  const tl = (data?.sentences || []).flatMap(s => s.timeline);
  for (let i = 0; i < tl.length; i++) { acc += tl[i].duration; if (t < acc) return { it: items[i], seg: null }; }
  return { it: items[items.length - 1], seg: null };
}
// 입 모양으로 말할 한국어: 글로스에서 번호·기호를 떼고, 동사·형용사는 '다' 를 뗌 (입다1 → 입, 위험1 → 위험). 지문자(FS:)는 없음
function mouthText(g) {
  if (!g || g.startsWith("FS:")) return "";
  const w = g.replace(/[\d#]+$/, "");
  return w.length > 1 ? w.replace(/다$/, "") : w;
}
let playId = 0;
const HOLD_MS = 100, LOWER_MS = 200;   // 손 내리기는 동작 데이터 끝에 포함됨 → 짧게 마무리
// m: 재생할 동작 (기본: 답변 전체), only: 단어 하나만 다시 볼 때 그 단어
function play(m = motion, only = null) {
  cancelAnimationFrame(raf);
  const id = ++playId;
  frameF = 0; lastT = performance.now();
  const loop = (now) => {
    const fps = m?.fps || 30;
    frameF += (now - lastT) / 1000 * fps; lastT = now;
    const n = totalFrames(m);
    const f = Math.min(Math.floor(frameF), Math.max(n - 1, 0));
    const fr = m && m.frames.length ? m.frames[f] : null;
    const cur = currentItem(f, m, only), it = cur && cur.it, seg = cur && cur.seg;
    const word = seg && seg.end > seg.start
      ? { gloss: seg.gloss || it.gloss, t: (f - seg.start) / (seg.end - seg.start), nms: it && it.nms, text: mouthText(seg.gloss || it.gloss) } : null;
    // 단어 표정·고개·입 모양 + 단어 사이 연결 구간(회전으로 섞기)용 동작 전체. 프레임 사이는 보간 (화면 주사율로 부드럽게)
    if (window.avatar) { if (fr && window.avatar.setFrameAt) window.avatar.setFrameAt(m, Math.min(frameF, n - 1), word); else window.avatar.setFrame(fr, word, m); }
    items.forEach(x => x.li.classList.toggle("active", x === it));
    if (frameF < n) raf = requestAnimationFrame(loop);
    else {
      // 동작이 화면에서 완전히 끝난 뒤(손 내리기까지)에 강조를 끔
      setTimeout(() => {
        if (id !== playId) return;               // 그 사이 다시 보기·새 질문이면 무시
        if (window.avatar) window.avatar.setFrame(null);
        setTimeout(() => { if (id === playId) items.forEach(x => x.li.classList.remove("active")); }, LOWER_MS);
      }, HOLD_MS);
    }
  };
  raf = requestAnimationFrame(loop);
}
// 단어 블록을 누르면 그 단어만 다시 보기 (손 올리기 → 그 단어 → 손 내리기)
const wordMotion = new Map();
async function playWord(it) {
  const g = it.seg.gloss || it.gloss;
  let m = wordMotion.get(g);
  if (!m) {
    try {
      const r = await fetch(`${API}/motion`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ glosses: [g] }) });
      m = r.ok ? await r.json() : null;
    } catch { m = null; }
    if (!m || !m.frames.length) return;
    wordMotion.set(g, m);
  }
  play(m, it);
}
$("replay").onclick = () => data && play();

renderExamples();
placeBoot();   // 예시 질문까지 그려진 첫 화면 기준으로 로딩 제목 위치를 잡고 보이게
examplesReady.then(list => {
  if (list.length) { POOL = shuffle(list); shown = []; renderExamples(); }
  placeBoot();
}).catch(() => {});
</script>
</body>
</html>
