<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이음 · 작업 안전 수어 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sign-blue: #134e9a;      /* 착용 의무 표지판 파랑 */
    --sign-blue-deep: #0d3a75;
    --concrete: #eceee9;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6874;
    --line: #d5d9d2;
    --caution: #f2b705;        /* 경고 표지 노랑 */
    --caution-ink: #3d2e00;
    --block-gap: 32px;         /* 입력창–아바타, 아바타–출처 간격 (같게) */
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--concrete);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    gap: var(--block-gap);
  }
  .app { grid-template-columns: minmax(0, 1fr); position: relative; }
  .app > * { min-width: 0; }

  /* ---------- 첫 화면: 가운데 입력창 → 결과 화면: 위로 ---------- */
  body.landing { overflow: hidden; }
  .hero { display: grid; gap: 14px; align-content: center; justify-items: center; }
  body.landing .hero { min-height: calc(100svh - 68px); }
  .hero h1 { margin: 0 0 6px; font-size: clamp(2.4rem, 8vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  body.result .hero h1 { display: none; }
  .notice { display: none; margin: 0; font-size: .88rem; color: var(--muted); }
  body.result .notice { display: block; }
  form.query { position: relative; width: min(100%, 640px); }
  form.query input {
    width: 100%;
    padding: 15px 64px 15px 20px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--surface);
    font-size: 1rem;
  }
  form.query input:focus, form.query input:focus-visible { outline: none; }
  form.query button {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border: 0; border-radius: 50%;
    background: var(--ink); color: #fff; cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  form.query button svg { width: 22px; height: 22px; }
  form.query button:disabled { opacity: .5; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 0 6px; justify-content: center; width: min(100%, 880px); }
  .examples .br { flex-basis: 100%; height: 0; }   /* 넓은 화면: 3개 / 2개 두 줄 */
  @media (max-width: 760px) { .examples .br { display: none; } }
  .examples button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 4px 12px; font-size: 1rem; cursor: pointer; color: var(--ink); margin: 3px 0;
  }
  .examples button:hover { border-color: var(--sign-blue); }

  /* 결과: 아래에서 올라옴 (그 사이 아바타는 미리 불러와 둠) */
  .results { display: grid; gap: var(--block-gap); grid-template-columns: minmax(0, 1fr); }
  .results > * { min-width: 0; }
  .results .stage-wrap { margin-top: -17px; }   /* 캔버스 위 빈 여백만큼 당겨서 두 간격을 눈으로도 같게 */
  body.landing .results { visibility: hidden; opacity: 0; transform: translateY(100vh); position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
  body.result .results { animation: rise .6s cubic-bezier(.2,.8,.2,1) .12s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(60vh); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    body.result .results { animation: none; }
  }

  /* ---------- 수어 표지판 무대 ---------- */
  .stage-wrap { display: grid; justify-items: center; gap: 14px; width: 100%; }
  .stage {
    position: relative;
    width: min(100%, 460px);
    aspect-ratio: 1.45;                 /* 배 아래는 잘라서 답변이 화면 안에 들어오도록 */
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage #av { opacity: 0; transition: opacity .5s; }
  .stage.three #av { opacity: 1; }
  .stage .loading { position: absolute; inset: auto 0 45% 0; text-align: center; color: var(--muted); font-size: 1rem; display: none; }
  .stage .loading.on { display: block; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button {
    border: 2px solid var(--ink); background: var(--surface); border-radius: 10px;
    padding: 6px 14px; font-weight: 700; cursor: pointer;
  }
  .controls label { font-size: 1rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  /* 글로스 순서 */
  ol.glosses {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  ol.glosses li {
    padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    font-weight: 500; transition: background .15s, color .15s;
  }
  ol.glosses li.sep { background: none; border: 0; color: var(--muted); padding: 4px 2px; }
  ol.glosses li.nomo { background: #d9dcd6; border-color: #d9dcd6; color: var(--ink); }   /* 동작 없는 단어: 재생 안 함 */
  ol.glosses li.active { background: var(--ink); color: #fff; border-color: var(--ink); }   /* 지금 표현 중 */

  /* ---------- 답변 · 출처 ---------- */
  .answer { background: var(--surface); border-radius: 14px; padding: 18px; border: 1px solid var(--line); }
  .answer h2 { font-size: 1rem; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .answer .text { font-size: 1rem; margin: 0 0 12px; }
  .signinfo { display: grid; gap: 8px; justify-items: center; text-align: center; width: 100%; }
  .signinfo:empty { display: none; }
  .signinfo p { margin: 0; }
  .signinfo .sign { color: var(--muted); font-size: 1rem; }
  .signinfo .warn { margin: 0; text-align: left; }
  .answer .hint { color: var(--muted); font-size: 1rem; margin: -4px 0 0; }
  .answer > :last-child { margin-bottom: 0; }
  .warn {
    border-left: 4px solid var(--caution); background: #fffaea; padding: 8px 12px; border-radius: 0 8px 8px 0;
    font-size: 1rem; margin: 0 0 12px;
  }
  .info { display: grid; gap: 16px; }
  .info > * { min-width: 0; }
  .src ul { list-style: none; margin: 0; padding: 0; font-size: 1rem; color: var(--muted); }
  .src li { margin-bottom: 12px; }
  .src li p { margin: 2px 0 0; }
  .src b { color: var(--ink); font-weight: 500; }
  .src .tbl { overflow-x: auto; margin: 6px 0 8px; }
  .src img.pdf { display: block; width: 100%; height: auto; margin: 8px 0 4px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .src table { border-collapse: collapse; width: 100%; font-size: 1rem; color: var(--ink); background: var(--surface); }
  .src th, .src td { border: 1px solid #9aa1a8; padding: 5px 8px; vertical-align: middle; line-height: 1.45; }
  .src th { background: #f1f2ef; font-weight: 500; text-align: center; }
  .src td:first-child { text-align: center; }
  .empty { color: var(--muted); }
  .error { color: #9b1c1c; }

  /* 화면이 넓어도 위아래 배치 (입력창 폭에 맞춤) */
  .results { width: min(100%, 640px); margin: 0 auto; }
</style>
</head>
<body class="landing">
<main class="app">
  <section class="hero" aria-label="검색">
    <h1>이음</h1>
    <p class="notice">일부 단어의 수어 동작만 준비되어 있습니다.</p>
    <form class="query" id="form">
      <input id="q" name="q" autocomplete="off" placeholder="어떤 도움을 드릴까요?" aria-label="질문 또는 문장 입력">
      <button id="go" type="submit" aria-label="수어로 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
    </form>
    <div class="examples" id="examples"></div>
  </section>

  <div class="results" id="results">
    <section class="stage-wrap" aria-label="수어 재생">
      <div class="stage" id="stage">
        <canvas id="av" aria-label="수어 아바타"></canvas>
        <span class="loading" id="loading"></span>
      </div>
      <ol class="glosses" id="glosses" aria-label="수어 순서"></ol>
      <div class="signinfo" id="signinfo"></div>
      <div class="controls" id="controls">
        <button type="button" id="replay">다시 보기</button>
      </div>
    </section>

    <div class="info">
      <section class="answer" id="answer" aria-live="polite"></section>
      <section class="answer src" id="sources" aria-label="출처" hidden></section>
    </div>
  </div>
</main>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/",
  "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
} }
</script>
<script>
// 모듈 파일을 못 불러오면(서버가 옛날 버전이거나 파일 누락) 그때만 안내
setTimeout(() => {
  if (!document.getElementById("stage").classList.contains("three")) {
    const el = document.getElementById("loading");
    el.textContent = "아바타를 불러오지 못했습니다. 서버를 다시 켠 뒤 새로고침하세요.";
    el.classList.add("on");
  }
}, 20000);
</script>
<script type="module">
import { SignAvatar } from "./avatar.js";
try {
  window.avatar = await new SignAvatar(document.getElementById("av")).load("./models/avatar.vrm");
  document.getElementById("stage").classList.add("three");
  window.dispatchEvent(new Event("avatar-ready"));
} catch (e) {
  console.warn("3D 아바타를 불러오지 못했습니다:", e);
  const el = document.getElementById("loading");
  el.textContent = "아바타를 불러오지 못했습니다. 서버를 다시 켠 뒤 새로고침하세요.";
  el.classList.add("on");
}
</script>
<script>
const API = location.protocol.startsWith("http") ? "" : "http://localhost:8000";
// 예시 질문: 서버(/examples)의 목록에서 무작위로 5개. 이번 접속에서 이미 한 질문과
// 주제가 같거나(같은 안내 문장·같은 문서 문단으로 답이 감) 글자가 비슷하면 숨김. 새로고침하면 다시 무작위.
let POOL = [
  "위험한 곳에서는 어떻게 해야 하나요?",
  "낙하물은 어떻게 조심해요?",
  "감전 위험이 있으면 뭘 착용해야 해요?",
  "보호구에 이상이 있는지 어떻게 확인해요?",
  "정화통은 언제 교체해요?",
].map(q => ({ question: q, topic: null }));
const SHOW = 4;   // 2개씩 2줄
const asked = { texts: [], topics: new Set() };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bigrams = (t) => { const s = t.replace(/[\s?.!,~]/g, ""), g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
function similar(a, b) {                       // 글자 2개 단위 겹침 비율 (짧은 쪽 기준)
  const A = bigrams(a), B = bigrams(b); let n = 0;
  A.forEach(x => { if (B.has(x)) n++; });
  return n / Math.max(1, Math.min(A.size, B.size));
}
const usable = (e) => !(e.topic && asked.topics.has(e.topic)) && !asked.texts.some(t => similar(t, e.question) >= 0.6);
let shown = [];                                // 지금 보이는 예시 (자리 고정)
function visibleExamples() {
  // 숨겨야 할 예시만 그 자리에서 새 예시로 바꾸고, 나머지는 자리를 그대로 둠
  const fresh = POOL.filter(e => usable(e) && !shown.includes(e));
  shown = shown.map(e => usable(e) ? e : fresh.shift()).filter(Boolean);
  while (shown.length < SHOW && fresh.length) shown.push(fresh.shift());
  return shown;
}
shuffle(POOL);

const $ = (id) => document.getElementById(id);
let data = null, motion = null, items = [], frameF = 0, raf = 0, lastT = 0;

// ---------- 입력 ----------
function renderExamples() {
  $("examples").innerHTML = "";
  const list = visibleExamples().map(e => e.question);
  list.forEach((t, i) => {
    if (i === Math.ceil(list.length / 2)) { const br = document.createElement("span"); br.className = "br"; $("examples").append(br); }
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t;
    b.onclick = () => { $("q").value = t; $("q").focus(); };   // 입력창에만 넣고, 화살표를 눌러야 넘어감
    $("examples").append(b);
  });
}
$("form").onsubmit = (e) => { e.preventDefault(); run(); };

async function run() {
  const q = $("q").value.trim();
  if (!q) { $("q").focus(); return; }
  $("go").disabled = true;
  try {
    // 서버가 질문인지(문서 검색) 문장인지(바로 번역) 판단 → data.mode
    const res = await fetch(`${API}/query`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: q}),
    });
    if (res.status === 404 || res.status === 405)
      throw new Error("서버가 예전 버전입니다. 터미널에서 Ctrl+C로 끄고 다시 실행하세요");
    if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
    data = await res.json();
    asked.texts.push(q);                       // 한 질문(과 같은 주제)은 예시에서 빼기
    if (data.topic) asked.topics.add(data.topic);
    renderExamples();
    showResults();
    render();
  } catch (err) {
    showResults();
    $("sources").hidden = true;
    $("answer").innerHTML = `<p class="error">서버에 연결하지 못했습니다. 터미널에서 api 서버가 켜져 있는지 확인하세요. (${err.message})</p>`;
  } finally {
    $("go").disabled = false;
  }
}

// 첫 화면 → 결과 화면: 입력창은 제자리에서 위로 미끄러지고(FLIP), 결과는 아래에서 올라옴
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function showResults() {
  if (document.body.classList.contains("result")) return;
  const form = $("form"), y0 = form.getBoundingClientRect().top;
  document.body.classList.replace("landing", "result");
  if (reduce) return;
  const dy = y0 - form.getBoundingClientRect().top;
  form.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }],
               { duration: 550, easing: "cubic-bezier(.2,.8,.2,1)" });
}

// ---------- 결과 표시 ----------
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 'FS:' 지문자 표시, '위험1'·'낙하물0#' 같은 동형어 번호는 화면에서 숨김
const label = (g) => (g.startsWith("FS:") ? g.slice(3) : g).replace(/[_\-]?\d+#?$/, "");

// 출처: 원본 PDF의 해당 부분을 그대로 잘라 보여줌 (번호·들여쓰기·표 모양 유지). 글은 대체 텍스트로
function sourceImg(s) {
  const [x0, y0, x1, y1] = s.region;
  const q = new URLSearchParams({ doc: s.doc, page: s.page, x0, y0, x1, y1 });
  return `<img class="pdf" src="${API}/source_image?${q}" alt="${esc(s.text)}" loading="lazy"
           style="aspect-ratio: ${(x1 - x0).toFixed(1)} / ${(y1 - y0).toFixed(1)}">`;
}

// 원문 PDF 표 → HTML 표. 병합된 칸(null)은 위 칸(rowspan) 또는 왼쪽 칸(colspan)으로 합침
function tableHTML(rows) {
  const n = Math.max(...rows.map(r => r.length));
  const own = rows.map(() => Array(n).fill(null)), cells = [];
  rows.forEach((r, i) => {
    for (let j = 0; j < n; j++) {
      const v = r[j];
      if (v !== null && v !== undefined) { const c = { v, i, j, rs: 1, cs: 1 }; cells.push(c); own[i][j] = c; continue; }
      const up = i > 0 ? own[i - 1][j] : null, left = j > 0 ? own[i][j - 1] : null;
      const o = left && left.i === i && !up ? left : (up || left);
      if (!o) continue;
      own[i][j] = o;
      if (o === up) o.rs = Math.max(o.rs, i - o.i + 1); else o.cs = Math.max(o.cs, j - o.j + 1);
    }
  });
  const body = rows.map((r, i) => "<tr>" + cells.filter(c => c.i === i).map(c => {
    const tag = i === 0 ? "th" : "td";
    return `<${tag}${c.rs > 1 ? ` rowspan="${c.rs}"` : ""}${c.cs > 1 ? ` colspan="${c.cs}"` : ""}>${esc(c.v)}</${tag}>`;
  }).join("") + "</tr>").join("");
  return `<div class="tbl"><table>${body}</table></div>`;
}

// 문서에 근거가 없으면 답하지 않음 (엉뚱한 답·수어 대신 안내만)
function renderNone() {
  motion = null; items = [];
  $("glosses").innerHTML = ""; $("signinfo").innerHTML = ""; 
  $("controls").hidden = true; $("sources").hidden = true;
  $("answer").innerHTML = `<h2>답변</h2>
    <p class="text">문서에서 관련 내용을 찾지 못했습니다.</p>
    <p class="hint">보호구 착용·관리처럼 산업안전 문서에 있는 내용을 질문하거나, 안전 안내 문장을 입력해 주세요.</p>`;
  cancelAnimationFrame(raf);
  if (window.avatar) window.avatar.setFrame(null);
}

function render() {
  if (data.mode === "none") return renderNone();
  $("controls").hidden = false;
  motion = data.motion;
  const sents = data.sentences || [];
  const unverified = [...new Set(sents.flatMap(s => s.unverified_terms || []))];
  const partial = "";   // 동작 준비 상태 안내는 입력창 위에 항상 표시 (.notice)

  // 글로스 순서 (문장 사이 구분)
  items = [];
  const ol = $("glosses"); ol.innerHTML = "";
  let k = 0;
  sents.forEach((s, si) => {
    if (si > 0) { const li = document.createElement("li"); li.className = "sep"; li.textContent = "/"; li.setAttribute("aria-hidden", "true"); ol.append(li); }
    s.gloss.forEach(g => {
      const li = document.createElement("li");
      li.textContent = label(g);
      const seg = motion ? motion.segments[k] : null;
      if (!(seg && seg.has_motion)) { li.className = "nomo"; li.title = "아직 아바타 동작이 없는 단어"; }
      ol.append(li);
      items.push({ gloss: g, li, seg });
      k++;
    });
  });

  // 아바타 영역: 수어 표현이 확인 안 된 단어 안내
  $("signinfo").innerHTML = `
    ${unverified.length ? `<p class="warn">${unverified.map(esc).join(", ")}: 아직 수어 표현이 확인되지 않아 지문자로 표시합니다.</p>` : ""}
    ${partial}`;

  // 답변
  const a = $("answer");
  if (data.mode === "ask") {
    // 출처: 쪽 번호 순
    const src = [...(data.sources || [])].sort((x, y) => x.page - y.page).map(s =>
      `<li><b>${esc(s.title || s.doc)} ${esc(s.page)}쪽</b>${s.region ? sourceImg(s) :
        (s.blocks || s.text.split("\n").map(t => ({type: "text", text: t})))
        .map(b => b.type === "table" ? tableHTML(b.rows) : `<p>${esc(b.text)}</p>`).join("")}</li>`).join("");
    a.innerHTML = `
      <h2>답변</h2>
      <p class="text">${esc(data.answer_text || "문서에서 관련 내용을 찾지 못했습니다.")}</p>
`;
    $("sources").innerHTML = src ? `<h2>출처</h2><ul>${src}</ul>` : "";
    $("sources").hidden = !src;
  } else {
    $("sources").hidden = true;
    a.innerHTML = `<h2>번역한 문장</h2><p class="text">${sents.map(s => esc(s.korean)).join(" ")}</p>`;
  }
  // 결과가 다 올라온 뒤 재생 (아바타가 아직이면 준비되는 대로)
  const start = () => setTimeout(play, reduce ? 0 : 650);
  if (window.avatar) start(); else addEventListener("avatar-ready", start, { once: true });
}

// ---------- 재생 ----------
function totalFrames() {
  if (motion) return motion.frames.length;      // 동작 없는 단어는 프레임이 없어서 자동으로 건너뜀
  // 동작 데이터가 없으면 timeline(예상 시간)으로 글로스만 순서대로 강조
  return Math.round((data?.sentences || []).flatMap(s => s.timeline).reduce((t, x) => t + x.duration, 0) * 30);
}
function currentItem(f) {
  if (motion && motion.segments.length) {
    let cur = null;
    for (const it of items) if (it.seg && it.seg.has_motion && f >= it.seg.start) cur = it;
    return cur;
  }
  let t = f / 30, acc = 0;
  const tl = (data?.sentences || []).flatMap(s => s.timeline);
  for (let i = 0; i < tl.length; i++) { acc += tl[i].duration; if (t < acc) return items[i]; }
  return items[items.length - 1];
}
function play() {
  cancelAnimationFrame(raf);
  frameF = 0; lastT = performance.now();
  const loop = (now) => {
    const fps = motion?.fps || 30;
    frameF += (now - lastT) / 1000 * fps; lastT = now;
    const n = totalFrames();
    const f = Math.min(Math.floor(frameF), Math.max(n - 1, 0));
    const fr = motion && motion.frames.length ? motion.frames[f] : null;
    if (window.avatar) window.avatar.setFrame(fr);
    const it = currentItem(f);
    items.forEach(x => x.li.classList.toggle("active", x === it));
    if (frameF < n) raf = requestAnimationFrame(loop);
    else {
      items.forEach(x => x.li.classList.remove("active")); 
      setTimeout(() => { if (window.avatar) window.avatar.setFrame(null); }, 600);   // 끝나면 손 내리기
    }
  };
  raf = requestAnimationFrame(loop);
}
$("replay").onclick = () => data && play();

renderExamples();
fetch(`${API}/examples`).then(r => r.ok ? r.json() : []).then(list => {
  if (list.length) { POOL = shuffle(list); shown = []; renderExamples(); }
}).catch(() => {});
</script>
