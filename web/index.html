<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이음 · 작업 안전 수어 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sign-blue: #134e9a;      /* 착용 의무 표지판 파랑 */
    --sign-blue-deep: #0d3a75;
    --concrete: #eceee9;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6874;
    --line: #d5d9d2;
    --caution: #f2b705;        /* 경고 표지 노랑 */
    --caution-ink: #3d2e00;
    --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--concrete);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--caution); outline-offset: 2px; }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    gap: 20px;
  }
  .app, .ask { grid-template-columns: minmax(0, 1fr); }
  .app > * { min-width: 0; }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  header h1 { font-size: 1.6rem; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 .tag { font-size: 1rem; font-weight: 500; color: var(--muted); }

  /* ---------- 질문 입력 ---------- */
  .ask { display: grid; gap: 10px; }
  form.query { display: flex; gap: 8px; }
  form.query input {
    flex: 1; min-width: 0;
    padding: 14px 16px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: var(--surface);
    font-size: 1.05rem;
  }
  form.query button {
    border: 0; border-radius: 12px; padding: 0 20px;
    background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  form.query button:disabled { opacity: .5; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 4px 12px; font-size: .88rem; cursor: pointer; color: var(--ink);
  }
  .examples button:hover { border-color: var(--sign-blue); }

  /* ---------- 수어 표지판 무대 ---------- */
  .stage-wrap { display: grid; justify-items: center; gap: 14px; width: 100%; }
  .stage {
    position: relative;
    width: min(100%, 460px);
    aspect-ratio: 1;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage #av { opacity: 0; transition: opacity .5s; }
  .stage.three #av { opacity: 1; }
  .stage .loading { position: absolute; inset: auto 0 45% 0; text-align: center; color: var(--muted); font-size: .9rem; display: none; }
  .stage .loading.on { display: block; }
  .stage .fs {
    position: absolute; left: 50%; bottom: 17%; transform: translateX(-50%);
    background: var(--caution); color: var(--caution-ink);
    padding: 6px 14px; border-radius: 8px; font-weight: 700; white-space: nowrap; display: none;
  }
  .stage .fs.on { display: block; }
  .now {
    min-height: 2.6rem;
    font-size: clamp(1.7rem, 6vw, 2.3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.2;
  }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls button {
    border: 2px solid var(--ink); background: var(--surface); border-radius: 10px;
    padding: 6px 14px; font-weight: 700; cursor: pointer;
  }
  .controls label { font-size: .88rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  /* 글로스 순서 */
  ol.glosses {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  ol.glosses li {
    padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
    font-weight: 500; transition: background .15s, color .15s;
  }
  ol.glosses li.sep { background: none; border: 0; color: var(--muted); padding: 4px 2px; }
  ol.glosses li.fs { background: #fff6d6; border-color: var(--caution); }
  ol.glosses li.active { background: var(--sign-blue); color: #fff; border-color: var(--sign-blue); }

  /* ---------- 답변 · 출처 ---------- */
  .answer { background: var(--surface); border-radius: 14px; padding: 18px 18px 14px; border: 1px solid var(--line); }
  .answer h2 { font-size: .95rem; margin: 0 0 6px; color: var(--muted); font-weight: 500; }
  .answer .text { font-size: 1.1rem; margin: 0 0 12px; }
  .warn {
    border-left: 4px solid var(--caution); background: #fffaea; padding: 8px 12px; border-radius: 0 8px 8px 0;
    font-size: .92rem; margin: 0 0 12px;
  }
  details.src { border-top: 1px solid var(--line); padding-top: 10px; }
  details.src summary { cursor: pointer; font-weight: 500; }
  details.src ol { margin: 8px 0 0; padding-left: 1.2rem; font-size: .9rem; color: var(--muted); }
  details.src li { margin-bottom: 8px; }
  details.src b { color: var(--ink); font-weight: 500; }
  .empty { color: var(--muted); }
  .error { color: #9b1c1c; }

  @media (min-width: 860px) {
    .app { grid-template-columns: 440px 1fr; column-gap: 40px; align-items: start; padding-top: 32px; }
    header, .ask { grid-column: 1 / -1; }
    .stage-wrap { position: sticky; top: 24px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>이음 <span class="tag">작업 안전 수어 안내</span></h1>
    <p>질문하면 안전 문서에서 답을 찾고, 문장을 넣으면 그대로 한국수어로 보여줍니다.</p>
  </header>

  <section class="ask" aria-label="검색">
    <form class="query" id="form">
      <input id="q" name="q" autocomplete="off" placeholder="궁금한 안전 수칙을 묻거나, 수어로 볼 문장을 입력하세요" aria-label="질문 또는 문장 입력">
      <button id="go" type="submit">수어로 보기</button>
    </form>
    <div class="examples" id="examples"></div>
  </section>

  <section class="stage-wrap" aria-label="수어 재생">
    <div class="stage" id="stage">
      <canvas id="av" aria-label="수어 아바타"></canvas>
      <span class="loading" id="loading"></span>
      <div class="fs" id="fs"></div>
    </div>
    <div class="now" id="now" aria-live="polite"></div>
    <div class="controls">
      <button type="button" id="replay">다시 보기</button>
    </div>
    <ol class="glosses" id="glosses" aria-label="수어 순서"></ol>
  </section>

  <section class="answer" id="answer" aria-live="polite">
    <p class="empty">질문하면 여기에 답변과 근거 문서가 나옵니다.</p>
  </section>
</main>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/",
  "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
} }
</script>
<script>
// 모듈 파일을 못 불러오면(서버가 옛날 버전이거나 파일 누락) 그때만 안내
setTimeout(() => {
  if (!document.getElementById("stage").classList.contains("three")) {
    const el = document.getElementById("loading");
    el.textContent = "아바타를 불러오지 못했습니다. 서버를 다시 켠 뒤 새로고침하세요.";
    el.classList.add("on");
  }
}, 20000);
</script>
<script type="module">
import { SignAvatar } from "./avatar.js";
try {
  window.avatar = await new SignAvatar(document.getElementById("av")).load("./models/avatar.vrm");
  document.getElementById("stage").classList.add("three");
} catch (e) {
  console.warn("3D 아바타를 불러오지 못했습니다:", e);
  const el = document.getElementById("loading");
  el.textContent = "아바타를 불러오지 못했습니다. 서버를 다시 켠 뒤 새로고침하세요.";
  el.classList.add("on");
}
</script>
<script>
const API = location.protocol.startsWith("http") ? "" : "http://localhost:8000";
let EXAMPLES = ["보안경은 언제 써야 하나요?", "낙하물은 어떻게 조심해요?", "위험한 곳에서는 작업을 중지하세요."];

const $ = (id) => document.getElementById(id);
let data = null, motion = null, items = [], frameF = 0, raf = 0, lastT = 0;

// ---------- 입력 ----------
function renderExamples() {
  $("examples").innerHTML = "";
  EXAMPLES.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t;
    b.onclick = () => { $("q").value = t; run(); };
    $("examples").append(b);
  });
}
$("form").onsubmit = (e) => { e.preventDefault(); run(); };

async function run() {
  const q = $("q").value.trim();
  if (!q) { $("q").focus(); return; }
  $("go").disabled = true;
  try {
    // 서버가 질문인지(문서 검색) 문장인지(바로 번역) 판단 → data.mode
    const res = await fetch(`${API}/query`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: q}),
    });
    if (res.status === 404 || res.status === 405)
      throw new Error("서버가 예전 버전입니다. 터미널에서 Ctrl+C로 끄고 다시 실행하세요");
    if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
    data = await res.json();
    render();
  } catch (err) {
    $("answer").innerHTML = `<p class="error">서버에 연결하지 못했습니다. 터미널에서 api 서버가 켜져 있는지 확인하세요. (${err.message})</p>`;
  } finally {
    $("go").disabled = false;
  }
}

// ---------- 결과 표시 ----------
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 'FS:' 지문자 표시, '위험1'·'낙하물0#' 같은 동형어 번호는 화면에서 숨김
const label = (g) => (g.startsWith("FS:") ? g.slice(3) : g).replace(/[_\-]?\d+#?$/, "");

function render() {
  motion = data.motion;
  const sents = data.sentences || [];
  const unverified = [...new Set(sents.flatMap(s => s.unverified_terms || []))];
  const partial = sents.filter(s => s.complete === false).length
    ? `<p class="warn">아직 일부 단어의 수어 동작만 준비되어 있어, 준비된 단어만 보여줍니다.</p>` : "";

  // 글로스 순서 (문장 사이 구분)
  items = [];
  const ol = $("glosses"); ol.innerHTML = "";
  let k = 0;
  sents.forEach((s, si) => {
    if (si > 0) { const li = document.createElement("li"); li.className = "sep"; li.textContent = "/"; li.setAttribute("aria-hidden", "true"); ol.append(li); }
    s.gloss.forEach(g => {
      const li = document.createElement("li");
      li.textContent = label(g);
      if (g.startsWith("FS:")) { li.className = "fs"; li.title = "수어 표현 확인 필요 · 지문자"; }
      ol.append(li);
      items.push({ gloss: g, li, seg: motion ? motion.segments[k] : null });
      k++;
    });
  });

  // 답변
  const a = $("answer");
  if (data.mode === "ask") {
    const src = (data.sources || []).map(s =>
      `<li><b>${esc(s.doc)} ${esc(s.page)}쪽</b><br>${esc(s.text.slice(0, 140))}${s.text.length > 140 ? "…" : ""}</li>`).join("");
    a.innerHTML = `
      <h2>답변</h2>
      <p class="text">${esc(data.answer_text || "문서에서 관련 내용을 찾지 못했습니다.")}</p>
      ${unverified.length ? `<p class="warn">${unverified.map(esc).join(", ")}: 아직 수어 표현이 확인되지 않아 지문자로 표시합니다.</p>` : ""}
      ${partial}
      <details class="src" open><summary>근거 문서 ${data.sources.length}건</summary><ol>${src}</ol></details>`;
  } else {
    a.innerHTML = `<h2>번역한 문장</h2><p class="text">${sents.map(s => esc(s.korean)).join(" ")}</p>
      ${unverified.length ? `<p class="warn">${unverified.map(esc).join(", ")}: 아직 수어 표현이 확인되지 않아 지문자로 표시합니다.</p>` : ""}${partial}`;
  }
  play();
}

// ---------- 재생 ----------
function totalFrames() {
  if (motion && motion.frames.length) return motion.frames.length;
  // 동작 데이터가 없으면 timeline(예상 시간)으로 글로스만 순서대로 강조
  return Math.round((data?.sentences || []).flatMap(s => s.timeline).reduce((t, x) => t + x.duration, 0) * 30);
}
function currentItem(f) {
  if (motion && motion.segments.length) {
    let cur = null;
    for (const it of items) if (it.seg && f >= it.seg.start) cur = it;
    return cur;
  }
  let t = f / 30, acc = 0;
  const tl = (data?.sentences || []).flatMap(s => s.timeline);
  for (let i = 0; i < tl.length; i++) { acc += tl[i].duration; if (t < acc) return items[i]; }
  return items[items.length - 1];
}
function play() {
  cancelAnimationFrame(raf);
  frameF = 0; lastT = performance.now();
  const loop = (now) => {
    const fps = motion?.fps || 30;
    frameF += (now - lastT) / 1000 * fps; lastT = now;
    const n = totalFrames();
    const f = Math.min(Math.floor(frameF), Math.max(n - 1, 0));
    const fr = motion && motion.frames.length ? motion.frames[f] : null;
    if (window.avatar) window.avatar.setFrame(fr);
    const it = currentItem(f);
    items.forEach(x => x.li.classList.toggle("active", x === it));
    $("now").textContent = it ? label(it.gloss) : "";
    const fsOn = it && (it.gloss.startsWith("FS:") || (it.seg && !it.seg.has_motion));
    $("fs").classList.toggle("on", !!fsOn);
    $("fs").textContent = it && it.gloss.startsWith("FS:") ? `지문자 · ${label(it.gloss)}` : "동작 데이터 없음";
    if (frameF < n) raf = requestAnimationFrame(loop);
    else {
      items.forEach(x => x.li.classList.remove("active")); $("now").textContent = ""; $("fs").classList.remove("on");
      setTimeout(() => { if (window.avatar) window.avatar.setFrame(null); }, 600);   // 끝나면 손 내리기
    }
  };
  raf = requestAnimationFrame(loop);
}
$("replay").onclick = () => data && play();

renderExamples();
fetch(`${API}/demo_sentences`).then(r => r.ok ? r.json() : []).then(list => {
  if (!list.length) return;
  // 질문 예시 2개 + 확정 안내 문장 (조원이 정리한 5문장)
  EXAMPLES = ["위험한 곳에서는 어떻게 해야 하나요?", "정화통은 언제 교체해요?", ...list.map(d => d.korean)];
  renderExamples();
}).catch(() => {});
</script>
</body>
</html>
